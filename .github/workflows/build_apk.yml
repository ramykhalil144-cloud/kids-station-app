name: Build Kids Station Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compile Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Android Platform Files
        run: flutter create . --project-name kids_station_app --org eg.kidsstation.app

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Signed Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Ready-to-Install APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KidsStation-Egypt-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
